<!DOCTYPE html>
<html>
<head>
    <title>Tivora Webstore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-8">
        <h1 class="text-4xl font-bold mb-8">Tivora AI Fashion</h1>

        <!-- Step 1: Login -->
        <div id="step-login" class="step active bg-white p-8 rounded">
            <h2 class="text-2xl mb-4">Login</h2>
            <button onclick="login('female')" class="bg-pink-500 text-white px-6 py-3 rounded mr-4">
                👩 Female
            </button>
            <button onclick="login('male')" class="bg-blue-500 text-white px-6 py-3 rounded">
                👨 Male
            </button>
        </div>

        <!-- Step 2: Skin Tone (Female only) -->
        <div id="step-skintone" class="step bg-white p-8 rounded">
            <h2 class="text-2xl mb-4">Detect Skin Tone</h2>
            <input type="file" id="face-photo" accept="image/*" class="mb-4 border p-2">
            <br>
            <button onclick="detectSkinTone()" class="bg-purple-500 text-white px-6 py-2 rounded mr-2">
                Detect
            </button>
            <button onclick="skipSkinTone()" class="bg-gray-300 px-6 py-2 rounded">
                Skip
            </button>
            <p id="skin-result" class="mt-4 hidden text-green-600"></p>
        </div>

        <!-- Step 3: Body Photo -->
        <div id="step-photo" class="step bg-white p-8 rounded">
            <h2 class="text-2xl mb-4">Upload Your Photo</h2>
            <input type="file" id="body-photo" accept="image/*" class="mb-4 border p-2">
            <br>
            <button onclick="getRecommendations()" class="bg-blue-500 text-white px-6 py-2 rounded">
                Get Recommendations →
            </button>
        </div>

        <!-- Step 4: Recommendations -->
        <div id="step-recommendations" class="step bg-white p-8 rounded">
            <h2 class="text-2xl mb-4">Your Recommendations</h2>
            <div id="rec-grid" class="grid grid-cols-5 gap-4 mb-6"></div>
            <button onclick="generateTryOns()" class="bg-green-500 text-white px-6 py-3 rounded">
                Generate Try-Ons 🎨
            </button>
        </div>

        <!-- Step 5: Results -->
        <div id="step-results" class="step bg-white p-8 rounded">
            <div id="results-loading">
                <h2 class="text-2xl mb-4">Generating... (~2-3 min)</h2>
                <div class="animate-spin h-8 w-8 border-4 border-blue-500 rounded-full border-t-transparent"></div>
            </div>
            <div id="results-content" class="hidden">
                <h2 class="text-2xl mb-4">Your Try-Ons! 🎉</h2>
                <div id="results-grid" class="grid grid-cols-4 gap-4"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
